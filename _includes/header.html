<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      {%- comment -%} Logo mark (D-03), inline so it follows the colour scheme. Source: scripts/brand/make_logo.py {%- endcomment %}
      <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle class="mark-disc" cx="32" cy="32" r="32"/><path class="mark-accent" d="M21,31a11,11 0 0 1 22,0z" stroke="none"/><path class="mark-line" d="M10,31h44" stroke-width="4.4" stroke-linecap="round"/><path class="mark-accent" d="M14,44q4.5,-4.6 9,0t9,0t9,0t9,0" fill="none" stroke-width="4.4" stroke-linecap="round"/></svg>
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
